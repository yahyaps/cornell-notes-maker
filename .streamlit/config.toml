[server]
# Uploads larger than this are refused by Streamlit before reaching the app.
maxUploadSize = 50
enableXsrfProtection = true
# Serves static/ (the bundled fonts) at /app/static/.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# Never show tracebacks to visitors; errors are logged on the server.
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
# Palette of the Mansous store: cream background, blue primary, orange accent.
base = "light"
primaryColor = "#004488"
backgroundColor = "#FFF4EF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2D38"
baseFontSize = 18
borderColor = "#E5DCD5"
baseRadius = "0.6rem"
font = "Almarai, sans-serif"
headingFont = "Almarai, sans-serif"

[[theme.fontFaces]]
family = "Almarai"
url = "app/static/fonts/Almarai-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Almarai"
url = "app/static/fonts/Almarai-Bold.ttf"
weight = 700

[[theme.fontFaces]]
family = "Almarai"
url = "app/static/fonts/Almarai-ExtraBold.ttf"
weight = 800
